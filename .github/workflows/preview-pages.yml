name: Digest preview

on:
  workflow_dispatch:
    inputs:
      with_marker:
        description: Publish the lane marker (requires separate human approval)
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # Delete the public artifact after successful deployment.

concurrency:
  group: digest-preview-pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.18.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Export only the sample digest
        env:
          WITH_MARKER: ${{ inputs.with_marker }}
          LANE_MARKER: ${{ inputs.with_marker && secrets.LANE_MARKER || '' }}
        shell: bash
        run: |
          if [[ "$WITH_MARKER" == "true" ]]; then
            if [[ -z "${LANE_MARKER//[[:space:]]/}" ]]; then
              echo "::error::Marked publication requires the LANE_MARKER repository secret."
              exit 1
            fi
          else
            unset LANE_MARKER
          fi
          pnpm export:preview
      - name: Upload only the HTML file
        id: artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: var/preview
          retention-days: 1
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Delete the uploaded Actions artifact
        if: ${{ success() && steps.deployment.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
